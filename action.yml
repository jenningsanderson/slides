name: 'Build Slides Presentation'
description: >
  Convert a slides/ directory of Markdown files into a fully static
  Reveal.js presentation. Configuration is read from slides/config.yaml;
  action inputs act as overrides.

branding:
  icon: 'book-open'
  color: 'blue'

inputs:
  slides-dir:
    description: 'Directory containing slide .md files and config.yaml (relative to repo root)'
    required: false
    default: 'slides'

  output-dir:
    description: 'Output directory for the built presentation'
    required: false
    default: 'dist'

  title:
    description: 'Presentation title — overrides config.yaml'
    required: false
    default: ''

  base-url:
    description: >
      Base URL for asset paths. Set to /<repo-name>/ for GitHub Pages project
      sites. Overrides config.yaml.
    required: false
    default: ''

  assets-dir:
    description: >
      Assets directory copied into the output. Defaults to "assets/" at the
      repo root if present. Overrides config.yaml.
    required: false
    default: 'assets'

  extra-build-args:
    description: 'Additional arguments forwarded verbatim to slides build'
    required: false
    default: ''

outputs:
  output-dir:
    description: 'Absolute path to the built presentation directory'
    value: ${{ steps.resolve-output.outputs.path }}

runs:
  using: 'composite'
  steps:
    - name: Resolve output path
      id: resolve-output
      shell: bash
      run: |
        echo "path=${{ github.workspace }}/${{ inputs.output-dir }}" >> "$GITHUB_OUTPUT"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Install Python dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: uv sync --frozen

    - name: Create output directory and copy Reveal.js vendor files
      shell: bash
      run: |
        mkdir -p "${{ github.workspace }}/${{ inputs.output-dir }}"
        cp -r "${{ github.action_path }}/vendor" \
              "${{ github.workspace }}/${{ inputs.output-dir }}/vendor"

    - name: Copy CSS (slides/css/ > repo root css/ > action default)
      shell: bash
      run: |
        SLIDES_CSS="${{ github.workspace }}/${{ inputs.slides-dir }}/css"
        ROOT_CSS="${{ github.workspace }}/css"
        ACTION_CSS="${{ github.action_path }}/slides/css"

        if [ -d "$SLIDES_CSS" ]; then
          CSS_SRC="$SLIDES_CSS"
        elif [ -d "$ROOT_CSS" ]; then
          CSS_SRC="$ROOT_CSS"
        else
          CSS_SRC="$ACTION_CSS"
        fi
        cp -r "$CSS_SRC" "${{ github.workspace }}/${{ inputs.output-dir }}/css"

    - name: Copy assets (if present)
      shell: bash
      run: |
        ASSETS="${{ github.workspace }}/${{ inputs.assets-dir }}"
        if [ -d "$ASSETS" ]; then
          cp -r "$ASSETS" "${{ github.workspace }}/${{ inputs.output-dir }}/assets"
        fi

    - name: Build presentation
      shell: bash
      run: |
        ARGS=(--no-backup)
        if [ -n "${{ inputs.title }}" ]; then
          ARGS+=(--title "${{ inputs.title }}")
        fi
        if [ -n "${{ inputs.base-url }}" ]; then
          ARGS+=(--base-url "${{ inputs.base-url }}")
        fi
        if [ -n "${{ inputs.extra-build-args }}" ]; then
          ARGS+=(${{ inputs.extra-build-args }})
        fi

        uv run --project "${{ github.action_path }}" slides build \
          --slides-dir "${{ github.workspace }}/${{ inputs.slides-dir }}" \
          --output "${{ github.workspace }}/${{ inputs.output-dir }}/index.html" \
          "${ARGS[@]}"
