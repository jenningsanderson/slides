# CI: verify slides build, lint, and validate against the example slides.

name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build example slides
        run: uv run slides build --no-backup

      - name: Print outline
        run: uv run slides outline

      - name: Validate images
        run: uv run slides build --validate-images
